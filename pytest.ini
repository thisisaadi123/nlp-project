[pytest]
testpaths = tests
# Tests that call Groq/Gemini are skipped by default; run them with:  pytest -m network
addopts = -m "not network" -q
markers =
    network: calls external APIs (Groq, Gemini); needs keys in .env and uses free-tier quota
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
